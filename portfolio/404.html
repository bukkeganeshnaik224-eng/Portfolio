<!doctype html>
<html lang="en" data-theme="dark">
<head>

  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; padding: 32px; text-align: center; }
    .nf h1 { font-family: var(--font-display); font-size: clamp(80px, 22vw, 200px); line-height: .9; letter-spacing: -.05em; }

    .nf pre { display: inline-block; text-align: left; margin: 0 0 30px; padding: 14px 18px; border-radius: 10px; border: 1px solid var(--border); background: rgba(5,8,12,.8); color: #cbd5e1; font-size: 13px; }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow-a" aria-hidden="true"></div>
  <main class="nf">
    <div>
      <p class="eyebrow mono">// error 404</p>
      <h1 class="grad">404</h1>
      <p>This route does not exist. It may have moved, or the link was mistyped.</p>
      <pre class="mono"><span class="c-g">ganesh@portfolio:~$</span> cd /missing-page
bash: cd: /missing-page: No such file or directory</pre><br />
